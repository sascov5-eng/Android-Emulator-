services:
  backend:
    build:
      context: ./backend
    network_mode: host
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ANDROID_EMULATOR_DATA_DIR: /data
      ANDROID_EMULATOR_ADB_HOST: 127.0.0.1
    volumes:
      - android-emulator-backend-data:/data
      # RuntimeManager controls ReDroid through the host Docker daemon.
      # This grants the backend host-level Docker privileges; keep the API trusted/private.
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  android-emulator-backend-data:
