name: AndroidEmulator
options:
  bundleIdPrefix: com.androidemulator
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  AndroidEmulator:
    type: application
    platform: iOS
    sources:
      - path: AndroidEmulator
    info:
      path: AndroidEmulator/Info.plist
      properties:
        CFBundleDisplayName: Android Emulator
        CFBundleShortVersionString: 0.1.0
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.androidemulator.client
        PRODUCT_NAME: AndroidEmulator
        TARGETED_DEVICE_FAMILY: "1,2"
  AndroidEmulatorTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AndroidEmulatorTests
    dependencies:
      - target: AndroidEmulator
schemes:
  AndroidEmulator:
    build:
      targets:
        AndroidEmulator: all
        AndroidEmulatorTests: [test]
    test:
      targets:
        - AndroidEmulatorTests
