name: Build iOS IPA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/build-ios.yml"
  push:
    branches:
      - main
      - "feat/**"
    paths:
      - "ios/**"
      - ".github/workflows/build-ios.yml"

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Validate generated app metadata
        working-directory: ios
        run: |
          python3 - <<'PY'
          import plistlib
          from pathlib import Path

          path = Path("AndroidEmulator/Info.plist")
          with path.open("rb") as stream:
              info = plistlib.load(stream)

          assert info["CFBundleDisplayName"] == "Android Emulator"
          assert info["CFBundleShortVersionString"] == "0.1.0"
          assert str(info["CFBundleVersion"]) == "1"
          assert info["NSAppTransportSecurity"]["NSAllowsArbitraryLoads"] is True
          PY

      - name: Choose iPhone simulator
        id: simulator
        shell: bash
        run: |
          SIMULATOR_ID=$(python3 - <<'PY'
          import json
          import subprocess

          data = json.loads(subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "-j"]))
          for runtime, devices in data["devices"].items():
              if "iOS" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable") and device.get("name", "").startswith("iPhone"):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator found")
          PY
          )
          echo "id=$SIMULATOR_ID" >> "$GITHUB_OUTPUT"

      - name: Run iOS unit tests
        working-directory: ios
        run: |
          xcodebuild test \
            -project AndroidEmulator.xcodeproj \
            -scheme AndroidEmulator \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build unsigned device app
        working-directory: ios
        run: |
          xcodebuild build \
            -project AndroidEmulator.xcodeproj \
            -scheme AndroidEmulator \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        shell: bash
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos" -maxdepth 1 -name '*.app' -print -quit)
          if [ -z "$APP_PATH" ]; then
            echo "Built .app was not found"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/AndroidEmulator.app"
          cd "$RUNNER_TEMP/ipa"
          zip -qry "$GITHUB_WORKSPACE/AndroidEmulator-unsigned.ipa" Payload

      - name: Verify packaged IPA
        shell: bash
        run: |
          python3 - <<'PY'
          import plistlib
          import zipfile

          ipa = "AndroidEmulator-unsigned.ipa"
          with zipfile.ZipFile(ipa) as archive:
              names = set(archive.namelist())
              assert "Payload/AndroidEmulator.app/AndroidEmulator" in names
              info = plistlib.loads(archive.read("Payload/AndroidEmulator.app/Info.plist"))

          assert info["CFBundleIdentifier"] == "com.androidemulator.client"
          assert info["CFBundleDisplayName"] == "Android Emulator"
          assert info["CFBundleShortVersionString"] == "0.1.0"
          PY

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: AndroidEmulator-unsigned-ipa
          path: AndroidEmulator-unsigned.ipa
          if-no-files-found: error
          retention-days: 14
